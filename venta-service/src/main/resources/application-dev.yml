server:
  port: 8090

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/vehiculodb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update #  Cambiado a 'update' para que Spring cree automáticamente la tabla 'venta' si no existe
    show-sql: true
    open-in-view: false
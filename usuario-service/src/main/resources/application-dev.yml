server:
  port: 8085

spring:
  application:
    name: usuario-service

  datasource:
    url: jdbc:mysql://mysql:3306/usuariodb
    username: root
    password: root

    hikari:
      initialization-fail-timeout: 0
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  flyway:
    enabled: true
    repair-on-migrate: true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

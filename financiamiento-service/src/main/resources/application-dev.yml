server:
  port: 8082

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/financiamiento_db_dev?createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root  # <-- Coloca aquí la contraseña de tu MySQL si usas otra distinta de "root"
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
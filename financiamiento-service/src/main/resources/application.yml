server:
  port: 8098 # Puerto único para el servicio de Financiamiento (Diferente al de Venta)

spring:
  application:
    name: financiamiento-service # Nombre para que Eureka lo reconozca
  
  datasource:
    url: jdbc:mysql://localhost:3306/automotora_financiamiento_db?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: root # Cambia por tu usuario de MySQL si es otro
    password:     # Coloca aquí la contraseña de tu base de datos MySQL
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update # Sincroniza las tablas de financiamiento automáticamente
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

# Configuración para registrarse en el Servidor Eureka centralizado
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

# Configuración de Swagger / OpenAPI (IE 3.2.1)
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html